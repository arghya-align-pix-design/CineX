version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cinex-postgres
    environment:
      POSTGRES_DB: cinexdb
      POSTGRES_USER: cinex
      POSTGRES_PASSWORD: cinex123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cinex-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinex -d cinexdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: cinex-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cinex.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - cinex-net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: cinex-redis
    ports:
      - "6379:6379"
    networks:
      - cinex-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cinex
      dockerfile: Dockerfile
    container_name: cinex-backend-dev
    ports:
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/cinexdb?TimeZone=UTC"
      SPRING_DATASOURCE_USERNAME: cinex
      SPRING_DATASOURCE_PASSWORD: cinex123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinex-net

  frontend:
    build:
      context: ./cineX_Frontend
      dockerfile: Dockerfile
    container_name: cinex-frontend-dev
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cinex-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cinex-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9070:9090"
    networks:
      - cinex-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cinex-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - cinex-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cinex-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cinex-net
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

networks:
  cinex-net:
    driver: bridge