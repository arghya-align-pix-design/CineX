global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['cinex-alertmanager:9093']

rule_files:
  - '/etc/prometheus/alert.rules.yml'

scrape_configs:
  - job_name: 'cinex-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['cinex-backend:9090', 'host.docker.internal:9090']
        labels:
          environment: 'production'
          app: 'cinex'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
