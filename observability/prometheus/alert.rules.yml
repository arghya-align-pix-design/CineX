groups:
  - name: cinex-critical
    rules:
      - alert: CineXBackendDown
        expr: up{job="cinex-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "CineX backend is DOWN"
          description: "The Spring Boot backend has been unreachable for 30 seconds."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "More than 5% of HTTP requests are failing with server errors."

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API response times (p95 > 2s)"
          description: "95th percentile response time is over 2 seconds."

      - alert: HighJvmHeapUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"}
           / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage exceeding 85%"
          description: "Heap memory usage has exceeded 85% for 5 minutes."

      - alert: HikariPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP connection pool >90% utilized"
          description: "Database connection pool is near capacity."
